item.C-cecilion.name=Cecilion
item.C-cecilion.description=A basic mineral containing magic charge.
item.C-arcane-crystal.name=Arcane Crystal
item.C-arcane-crystal.description=A dense crystal infused with high magic charge.

item.C-empty-rune.name=Rune
item.C-empty-rune.description=A carved stone rune tablet that can be infused with magic charge.

block.C-rune-altar.name=Rune Altar
block.C-rune-altar.description=Sacrifices magic-charged minerals to infuse a rune. Higher charge increases success chance up to 95%.

block.C-safety-arm.name=Safety Arm
block.C-safety-arm.description=A double-pendulum robotic arm that transfers items between two configured blocks. If the target cannot accept items, they are dropped to the ground.

block.C-covalent-node.name=Covalent Node
block.C-covalent-node.description=Wirelessly links covalent blocks within its range into a single covalent energy network.

block.C-covalent-beam-node.name=Covalent Beam Node
block.C-covalent-beam-node.description=Directional E.C. node: links to the first covalent block in the placement direction (rotate with R) and draws a beam toward it. Blocks that do not use the network stop the beam.

block.C-covalent-cell.name=Covalent Cell
block.C-covalent-cell.description=Stores covalent energy (E.C.) produced by transmutation chambers, like a battery.

block.C-transmutation-chamber.name=Transmutation Chamber
block.C-transmutation-chamber.description=Transmutes items into covalent energy (E.C.), releasing it into the network.

block.C-transmutation-forge.name=Transmutation Forge
block.C-transmutation-forge.description=Uses covalent energy (E.C.) to transmute the selected item. Click to choose an item.
