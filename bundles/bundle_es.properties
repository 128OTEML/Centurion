block.C-rune-altar.name=Altar Rúnico
block.C-rune-altar.description=Sacrifica minerales con carga mágica para infundir una Runa. A mayor carga sacrificada, mayor es la probabilidad de éxito (hasta 95%).

block.C-safety-arm.name=Brazo Robótico
block.C-safety-arm.description=Brazo robótico de péndulo doble que transfiere ítems entre dos bloques configurados. Si el destino no puede aceptar ítems, los suelta al suelo.

block.C-covalent-beam-node.name=Nodo Covalente Direccional
block.C-covalent-beam-node.description=Nodo E.C. direccional: enlaza el primer bloque covalente en la dirección de colocación (gíralo con R) y dibuja un rayo hacia él. Los bloques que no usan la red detienen el rayo.

block.C-covalent-cell.name=Celda Covalente
block.C-covalent-cell.description=Almacena energía covalente (E.C.) producida por las cámaras de transmutación, como una batería.

block.C-transmutation-chamber.name=Cámara de Transmutación
block.C-transmutation-chamber.description=Transmuta ítems en energía covalente (E.C.), liberándola a la red.

block.C-transmutation-forge.name=Forja de Transmutación
block.C-transmutation-forge.description=Usa energía covalente (E.C.) para transmutar el ítem seleccionado. Pulsa para elegir el ítem.
